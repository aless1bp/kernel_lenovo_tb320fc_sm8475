name: Build Lenovo TB320FC Kernel

on:
  push:
    branches: 
      - lineage-22.2
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name:  Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet:  'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with: 
          ref: lineage-22.2
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses5-dev: i386 \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1. 2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Download Clang Toolchain
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains

          # Clang r450784d (LineageOS 22.x)
          git clone --depth=1 https://gitlab.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r450784d. git clang

          # GCC ARM64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64

          # GCC ARM32
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm

      - name: Build Kernel (Waipio GKI)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH=~/toolchains/clang/bin
          export PATH=$CLANG_PATH:~/toolchains/gcc-arm64/bin:~/toolchains/gcc-arm/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Clean
          make mrproper

          # Generate base GKI defconfig
          make O=out ARCH=arm64 gki_defconfig

          # Merge Waipio GKI vendor config
          scripts/kconfig/merge_config. sh -O out out/.config \
            arch/arm64/configs/vendor/waipio_GKI. config

          # Build kernel
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Prepare artifacts
        run: |
          mkdir -p upload
          cp out/arch/arm64/boot/Image upload/ || true
          cp out/arch/arm64/boot/Image.gz upload/ || true
          cp out/arch/arm64/boot/dtbo.img upload/ || true
          find out -name "*.ko" -exec cp {} upload/ \; || true
          ls -lah upload/

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with: 
          name: kernel-waipio-gki-${{ github. sha }}
          path: upload/*

      - name: Build Kernel (Waipio Consolidate)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH=~/toolchains/clang/bin
          export PATH=$CLANG_PATH:~/toolchains/gcc-arm64/bin: ~/toolchains/gcc-arm/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Clean
          make mrproper

          # Generate defconfig
          make O=out ARCH=arm64 gki_defconfig

          # Merge consolidate fragment
          scripts/kconfig/merge_config. sh -O out out/.config \
            arch/arm64/configs/consolidate.fragment \
            arch/arm64/configs/vendor/waipio_consolidate. config

          # Build
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Prepare consolidate artifacts
        run: |
          mkdir -p upload-consolidate
          cp out/arch/arm64/boot/Image upload-consolidate/ || true
          cp out/arch/arm64/boot/Image.gz upload-consolidate/ || true
          cp out/arch/arm64/boot/dtbo.img upload-consolidate/ || true
          find out -name "*.ko" -exec cp {} upload-consolidate/ \; || true

      - name: Upload Consolidate Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-waipio-consolidate-${{ github.sha }}
          path: upload-consolidate/*
